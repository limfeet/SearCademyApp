  package_info_plus: ^9.0.0
  permission_handler: ^12.0.0+1
  recase: ^4.1.0
  riverpod_annotation: ^3.0.0
  shared_preferences: ^2.5.2
  url_strategy: ^0.3.0
  uuid: ^4.5.1
  validators: ^3.0.0

dev_dependencies:
  build_runner: ^2.7.1
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - assets/images/loading.gif
    - assets/images/no_image_icon.png
    - assets/images/searcademy_icon.png
    - .env
    - assets/data_combined.json
